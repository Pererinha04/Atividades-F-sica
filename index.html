<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="src/icontittle.png">
    <link rel="stylesheet" href="style_login.css">
    <title>Atividades Física</title>
</head>
<body>
    <div class="container">
        <form class="login-box">
            <h2 id="Entrar">Entrar</h2>
            
            <div class="input-group">
                <label>E-mail</label>
                <input id="email" type="email" placeholder="Digite seu email" required>
            </div>
            
            <div class="input-group">
                <label>Senha</label>
                <input id="password" type="password" placeholder="Digite sua Senha" required>
            </div>

            <button id="botaoLogin" type="button">Entrar</button>

            <p id="mensagem"></p>

            <p class="register">
                Não possui conta?
                <a href="./paginacadastro.html">Cadastre-se</a> <!--Para não
                                                                   ter erros no link
                                                                    use ./ -->
            </p>
        </form>
    </div>
    <script src="botao_login.js"></script>
</body>
</html>
