<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_cadastro.css">
    <link rel="icon" type="image/png" href="src/icontittle.png">
    <title>Atividades Física</title>
</head>
<body>
    <div class="container">
        <form class="login-box">
            <h2 id="cadastre-se">Cadastre-se</h2>

            <div class="input-group">
                <label>E-mail</label>
                <input id="email" type="email" placeholder="Digite seu email" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input id="password" type="password" placeholder="Digite sua senha" required>
            </div>
             
            <!-- ✅ type="button" -->
            <button id="buttoncadastro" type="button">Cadastro</button>

            <p id="mensagem"></p>

            <p class="Login">
                Já possui conta?
                <a href="./index.html">Login</a>
            </p>

        </form>
    </div>
    <script src="buttoncadastro.js"></script>
</body>
</html>
